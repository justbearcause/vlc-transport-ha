name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/vlc_transport_ha/manifest.json"))["version"])')
          echo "Tag version:      ${TAG_VERSION}"
          echo "Manifest version: ${MANIFEST_VERSION}"
          if [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "::error::Git tag (${GITHUB_REF_NAME}) does not match manifest.json version (${MANIFEST_VERSION})!"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/card.test.cjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # If version contains pre-release identifiers (e.g. -beta, b0, rc1), mark as prerelease
          if [[ "${TAG#v}" =~ [-a-zA-Z] ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping creation."
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes ${PRERELEASE_FLAG}
          fi
