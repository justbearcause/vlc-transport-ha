name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inject tag version into manifest.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          if not re.match(r"^\d+\.\d+\.\d+(?:[-a-zA-Z0-9.]+)?$", version):
              print(f"::error::Invalid version derived from tag: {version}", file=sys.stderr)
              sys.exit(1)

          manifest_path = Path("custom_components/vlc_transport_ha/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=4) + "\n", encoding="utf-8")
          print(f"Injected version {version} into {manifest_path}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/card.test.cjs

      - name: Package integration ZIP for HACS
        run: |
          cd custom_components/vlc_transport_ha
          zip -r "${GITHUB_WORKSPACE}/vlc_transport_ha.zip" . -x "*/__pycache__/*" "*.pyc" ".DS_Store"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # If version contains pre-release identifiers (e.g. -beta, b0, rc1), mark as prerelease
          if [[ "${TAG#v}" =~ [-a-zA-Z] ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading updated zip asset."
            gh release upload "${TAG}" vlc_transport_ha.zip --clobber
          else
            gh release create "${TAG}" vlc_transport_ha.zip --title "${TAG}" --generate-notes ${PRERELEASE_FLAG}
          fi
